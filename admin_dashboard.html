<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">

    <nav class="bg-white shadow px-6 py-4 flex justify-between items-center">
        <div class="text-xl font-bold text-red-600">🛡️ Admin Dashboard</div>
        <div class="flex items-center gap-4">
            <span id="navName" class="font-medium">กำลังโหลด...</span>
            <button onclick="logout()" class="text-red-500 hover:text-red-700">ออกจากระบบ</button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto mt-8 p-4 grid grid-cols-1 md:grid-cols-2 gap-8">
        
        <!-- Left Column: Create Event -->
        <div>
            <div class="bg-white rounded-lg shadow p-6 mb-8">
                <h3 class="text-xl font-bold mb-4">สร้างรอบเก็บเงินใหม่</h3>
                <form id="createEventForm" onsubmit="handleCreateEvent(event)">
                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-1">ชื่อรายการ (เช่น ค่าเสื้อสาขา)</label>
                        <input type="text" id="eventTitle" required class="w-full border rounded p-2">
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-1">จำนวนเงิน (บาท)</label>
                        <input type="number" id="eventAmount" required class="w-full border rounded p-2">
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-1">วันครบกำหนด (Due Date)</label>
                        <input type="date" id="eventDueDate" required class="w-full border rounded p-2">
                    </div>
                    <button type="submit" id="btnCreateEvent" class="w-full bg-red-600 text-white py-2 rounded font-bold hover:bg-red-700">สร้างรอบเก็บเงิน</button>
                </form>
            </div>
            
            <div class="bg-white rounded-lg shadow p-6">
                <h3 class="text-xl font-bold mb-4">จัดการรายรับ - รายจ่าย</h3>
                <p class="text-gray-500 text-sm mb-4">รอการเชื่อมต่อ API เพิ่มเติมสำหรับส่วนนี้</p>
                <button onclick="alert('กำลังพัฒนาส่วนบันทึกรายจ่าย')" class="w-full bg-gray-200 text-gray-700 py-2 rounded font-bold hover:bg-gray-300 mb-2">บันทึกรายจ่ายเหรัญญิก</button>
                <button onclick="alert('กำลังพัฒนาส่วนบันทึกรายรับสปอนเซอร์')" class="w-full bg-gray-200 text-gray-700 py-2 rounded font-bold hover:bg-gray-300">บันทึกเงินสปอนเซอร์</button>
            </div>
        </div>

        <!-- Right Column: Approvals -->
        <div class="bg-white rounded-lg shadow p-6">
            <h3 class="text-xl font-bold mb-4">ตรวจสอบสลิปการโอนเงิน (Pending)</h3>
            <div id="pendingList" class="grid gap-4">
                <p class="text-gray-500">รอการเชื่อมต่อ API โหลดรายการ...</p>
                <!-- ปลายเปิดสำหรับให้ GAS ดึงรายการที่มี Status = Pending มาแสดง -->
                <!-- Mock Layout: -->
                <!--
                <div class="border p-4 rounded flex justify-between items-center">
                    <div>
                        <p class="font-bold">ค่าเสื้อสาขา - รหัส 6601xxxx</p>
                        <p class="text-sm">ยอดโอน: 500 บาท</p>
                        <a href="#" target="_blank" class="text-blue-500 text-sm underline">ดูรูปสลิป</a>
                    </div>
                    <button class="bg-green-600 text-white px-4 py-2 rounded">อนุมัติ</button>
                </div>
                -->
            </div>
        </div>
        
    </main>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwMnLEpGSYmdqeQTgU5s4vtVTRKhhAC594wcF-wycBuJqy4tB-XOxi6xAsP6TXPUuy4ew/exec"; 

        document.addEventListener('DOMContentLoaded', () => {
            const userDataString = sessionStorage.getItem('loggedInUser');
            if (!userDataString) {
                window.location.href = 'index.html';
                return;
            }
            const user = JSON.parse(userDataString);
            
            if (user.role !== 'Admin' && user.email !== 'wanchanachaiu68@nu.ac.th') {
                alert('คุณไม่มีสิทธิ์เข้าถึงหน้านี้');
                window.location.href = 'student_dashboard.html';
                return;
            }

            document.getElementById('navName').textContent = user.name || 'Admin';
        });

        async function handleCreateEvent(e) {
            e.preventDefault();
            const btn = document.getElementById('btnCreateEvent');
            btn.textContent = 'กำลังสร้าง...';
            btn.disabled = true;

            const payload = {
                action: 'createEvent',
                payload: {
                    title: document.getElementById('eventTitle').value,
                    baseAmount: document.getElementById('eventAmount').value,
                    dueDate: document.getElementById('eventDueDate').value
                }
            };

            try {
                const res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                
                if (data.success) {
                    alert('สร้างรอบเก็บเงินและเพิ่มคอลัมน์ใน Matrix เรียบร้อยแล้ว!');
                    document.getElementById('createEventForm').reset();
                } else {
                    alert('Error: ' + data.message);
                }
            } catch (err) {
                console.error(err);
                alert('เชื่อมต่อระบบล้มเหลว');
            } finally {
                btn.textContent = 'สร้างรอบเก็บเงิน';
                btn.disabled = false;
            }
        }

        // ฟังก์ชัน Approve จำลองรอการเชื่อมต่อ API เต็มรูปแบบ
        async function approvePayment(paymentId, eventTitle, email, totalAmount) {
            if(!confirm('ยืนยันการอนุมัติยอดนี้?')) return;
            
            const payload = {
                action: 'approvePayment',
                payload: { paymentId, eventTitle, email, totalAmount }
            };

            try {
                const res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if(data.success) {
                    alert('อนุมัติสำเร็จ ข้อมูลอัปเดตลง Matrix แล้ว');
                    // Refresh List
                }
            } catch(e) {
                console.error(e);
            }
        }

        function logout() {
            sessionStorage.removeItem('loggedInUser');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
