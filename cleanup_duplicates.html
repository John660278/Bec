<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Cleanup Duplicates</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <style>
    body { font-family: ui-sans-serif, system-ui, sans-serif; padding: 2rem; background: #f0f2f5; }
    .card { background: white; padding: 2rem; border-radius: 12px; max-width: 650px; margin: auto; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; }
    h2 { margin-top: 0; color: #dc2626; }
    p { color: #666; }
    .warning { background: #fef2f2; border: 1px solid #fca5a5; border-radius: 8px; padding: 1rem; margin-bottom: 1.5rem; color: #dc2626; font-size: 0.9rem; }
    button { padding: 12px 24px; font-size: 15px; font-weight: bold; background: #dc2626; color: white; border: none; border-radius: 8px; cursor: pointer; margin: 0.5rem; }
    button:hover { background: #b91c1c; }
    button.preview { background: #2563eb; }
    button.preview:hover { background: #1d4ed8; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    #log { margin-top: 1.5rem; padding: 1rem; background: #1e293b; color: #10b981; border-radius: 8px; font-family: monospace; font-size: 13px; max-height: 350px; overflow-y: auto; text-align: left; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🧹 ลบข้อมูล Incomes/Expenses ซ้ำ</h2>
    <div class="warning">
      ⚠️ ใช้เครื่องมือนี้เพื่อลบข้อมูลที่ถูก migrate ซ้ำกันออกจาก Firebase<br>
      กด <b>ดูก่อน</b> เพื่อเช็คจำนวนก่อน แล้วค่อยกด <b>ลบข้อมูลซ้ำ</b>
    </div>
    <button class="preview" onclick="preview()">🔍 ดูก่อน (Preview)</button>
    <button id="deleteBtn" onclick="cleanup()" disabled>🗑️ ลบข้อมูลซ้ำ</button>
    <div id="log">รอคำสั่ง...</div>
  </div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyA1Zuhs25HvceVZYpErBuqzhrrTZfN1Z0k",
    authDomain: "bec-admin-80e83.firebaseapp.com",
    projectId: "bec-admin-80e83",
    storageBucket: "bec-admin-80e83.firebasestorage.app",
    messagingSenderId: "1089372941715",
    appId: "1:1089372941715:web:880b6f08cdaded6b804c66"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  function logMsg(msg, color) {
    const logDiv = document.getElementById('log');
    logDiv.innerHTML += '<div style="color:' + (color||'#10b981') + '">' + msg + '</div>';
    logDiv.scrollTop = logDiv.scrollHeight;
  }

  function findDuplicateIds(docs, keyFn) {
    const seen = {};
    const toDelete = [];
    docs.forEach(doc => {
      const key = keyFn(doc.data());
      if (seen[key]) {
        toDelete.push(doc.id);
      } else {
        seen[key] = true;
      }
    });
    return toDelete;
  }

  let incomeIdsToDelete = [];
  let expenseIdsToDelete = [];

  async function preview() {
    document.getElementById('log').innerHTML = '';
    logMsg('🔍 กำลังตรวจสอบข้อมูลซ้ำ...');

    const incSnap = await db.collection('incomes').get();
    const expSnap = await db.collection('expenses').get();

    logMsg('📥 พบ incomes ทั้งหมด: ' + incSnap.size + ' รายการ');
    logMsg('📤 พบ expenses ทั้งหมด: ' + expSnap.size + ' รายการ');

    incomeIdsToDelete = findDuplicateIds(incSnap.docs, d => d.source+'|'+d.amount+'|'+d.date);
    expenseIdsToDelete = findDuplicateIds(expSnap.docs, d => d.title+'|'+d.amount+'|'+d.date);

    if (incomeIdsToDelete.length === 0 && expenseIdsToDelete.length === 0) {
      logMsg('✅ ไม่พบข้อมูลซ้ำเลย! ข้อมูลสะอาดอยู่แล้วครับ', '#10b981');
    } else {
      logMsg('⚠️ พบ incomes ซ้ำ: ' + incomeIdsToDelete.length + ' รายการ', '#f59e0b');
      logMsg('⚠️ พบ expenses ซ้ำ: ' + expenseIdsToDelete.length + ' รายการ', '#f59e0b');
      logMsg('📊 หลังลบแล้วจะเหลือ incomes: ' + (incSnap.size - incomeIdsToDelete.length) + ' | expenses: ' + (expSnap.size - expenseIdsToDelete.length), '#60a5fa');
      logMsg('👆 กดปุ่ม "ลบข้อมูลซ้ำ" เพื่อดำเนินการต่อ', '#f59e0b');
      document.getElementById('deleteBtn').disabled = false;
    }
  }

  async function cleanup() {
    if (!confirm('ยืนยันการลบ:\n- incomes ซ้ำ: ' + incomeIdsToDelete.length + ' รายการ\n- expenses ซ้ำ: ' + expenseIdsToDelete.length + ' รายการ')) return;

    document.getElementById('deleteBtn').disabled = true;
    logMsg('🗑️ กำลังลบข้อมูลซ้ำ...');

    for (const id of incomeIdsToDelete) {
      await db.collection('incomes').doc(id).delete();
    }
    logMsg('✅ ลบ incomes ซ้ำ: ' + incomeIdsToDelete.length + ' รายการ');

    for (const id of expenseIdsToDelete) {
      await db.collection('expenses').doc(id).delete();
    }
    logMsg('✅ ลบ expenses ซ้ำ: ' + expenseIdsToDelete.length + ' รายการ');

    logMsg('🎉 เรียบร้อยแล้ว! ยอดรวมจะกลับมาถูกต้องครับ', '#10b981');
    alert('ลบข้อมูลซ้ำเรียบร้อยแล้ว! ลองรีเฟรชหน้าแอดมินดูครับ');
  }
</script>
</body>
</html>
