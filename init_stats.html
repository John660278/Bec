<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Initialize System Stats</title>
  <style>body { font-family: sans-serif; padding: 2rem; } button { padding: 1rem 2rem; font-size: 1.2rem; cursor: pointer; }</style>
</head>
<body>
  <h1>คำนวณและตั้งค่า System Stats ยอดสรุป</h1>
  <p>ปุ่มนี้จะทำการอ่านข้อมูลเก่าทั้งหมด 1 ครั้ง เพื่อสรุปยอด แล้วบันทึกลงใน Document เดียวเพื่อการใช้งานที่เร็วขึ้น</p>
  <button id="runBtn" onclick="runInit()">เริ่มคำนวณยอด</button>
  <pre id="output" style="margin-top:2rem; background:#f0f0f0; padding:1rem; border-radius:8px;"></pre>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA1Zuhs25HvceVZYpErBuqzhrrTZfN1Z0k",
      authDomain: "bec-admin-80e83.firebaseapp.com",
      projectId: "bec-admin-80e83",
      storageBucket: "bec-admin-80e83.firebasestorage.app",
      messagingSenderId: "1089372941715",
      appId: "1:1089372941715:web:880b6f08cdaded6b804c66"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const output = document.getElementById('output');
    function log(msg) {
      output.textContent += msg + "\n";
      console.log(msg);
    }

    async function runInit() {
      const btn = document.getElementById('runBtn');
      btn.disabled = true;
      btn.textContent = "กำลังคำนวณ... (ห้ามปิดหน้าต่าง)";
      log("เริ่มดึงข้อมูลทั้งหมด...");

      try {
        const [evSnap, paySnap, expSnap, incSnap] = await Promise.all([
          db.collection('events').get(),
          db.collection('payments').get(),
          db.collection('expenses').get(),
          db.collection('incomes').get()
        ]);

        let eventsCount = evSnap.size;
        let totalExpense = 0;
        let totalIncome = 0;
        let paidCount = 0;
        let pendingCount = 0;
        let totalPaidPayments = 0;

        expSnap.forEach(doc => { totalExpense += Number(doc.data().amount) || 0; });
        incSnap.forEach(doc => { totalIncome += Number(doc.data().amount) || 0; });
        
        paySnap.forEach(doc => {
          const p = doc.data();
          if (p.status === 'Paid') {
            paidCount++;
            totalPaidPayments += Number(p.paidAmount) || 0;
          } else if (p.status === 'Pending') {
            pendingCount++;
          }
        });

        // totalBalance = (ยอดรับสปอนเซอร์ + ยอดรับนิสิต) - ยอดจ่าย
        const totalBalance = totalIncome + totalPaidPayments - totalExpense;

        const stats = {
          eventsCount,
          totalExpense,
          totalIncome,
          paidCount,
          pendingCount,
          totalPaidPayments,
          totalBalance,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        log("สรุปยอดที่คำนวณได้:\n" + JSON.stringify(stats, null, 2));
        log("กำลังบันทึกไปยัง system_stats/overview...");

        await db.collection('system_stats').doc('overview').set(stats);

        log("✅ สำเร็จ! ตั้งค่า System Stats เรียบร้อยแล้ว (สามารถปิดหน้านี้ได้เลย)");
      } catch (err) {
        log("❌ Error: " + err.message);
      }
      btn.textContent = "เสร็จสิ้น";
    }
  </script>
</body>
</html>
