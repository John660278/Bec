<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gargantua Black Hole WebGL2 Background</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    #bhCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body>
  <!-- Fullscreen WebGL2 Canvas -->
  <canvas id="bhCanvas"></canvas>

  <script src="blackhole_webgl.js"></script>
  <script>
    const canvas = document.getElementById('bhCanvas');
    const controller = initBlackHoleBackground(canvas, {
      spinSpeed: 1.0,
      diskBrightness: 1.15,
      bloomStrength: 0.9
    });
  </script>
</body>
</html>
