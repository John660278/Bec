<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - BEC BA 69 Financial System</title>
    
    <!-- Google Fonts: Playfair Display for luxury serif title, Plus Jakarta Sans & Prompt for UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        // ถ้าเปิดผ่านแอป LINE ให้บังคับเด้งไป Safari/Chrome อัตโนมัติ
        if (navigator.userAgent.indexOf("Line") > -1) {
            if (window.location.search.indexOf("openExternalBrowser=1") === -1) {
                window.location.href = window.location.href + (window.location.href.indexOf('?') > -1 ? '&' : '?') + "openExternalBrowser=1";
            }
        }
    </script>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Plus Jakarta Sans', 'Prompt', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #09070c;
            color: #f1e8f8;
        }

        /* ---------- Canvas ---------- */
        #silkCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* ---------- Overlays ---------- */
        .gradient-overlay {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: radial-gradient(circle at 85% 15%, rgba(140, 85, 135, 0.28) 0%, transparent 55%),
                        radial-gradient(circle at 15% 85%, rgba(120, 75, 140, 0.25) 0%, transparent 50%),
                        linear-gradient(to bottom, rgba(9,7,12,0.4) 0%, transparent 50%, rgba(9,7,12,0.7) 100%);
            pointer-events: none;
        }

        /* Carbon / Dot grid texture with soft edge fade */
        .texture-overlay {
            position: absolute;
            inset: 0;
            z-index: 2;
            background-image: radial-gradient(rgba(240, 205, 245, 0.05) 1px, transparent 1px);
            background-size: 7px 7px;
            mask-image: radial-gradient(circle at 50% 45%, black 45%, transparent 95%);
            -webkit-mask-image: radial-gradient(circle at 50% 45%, black 45%, transparent 95%);
            pointer-events: none;
        }

        /* ---------- Center content ---------- */
        .content-wrapper {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 1rem;
            gap: 2rem;
        }

        /* ---------- Title ---------- */
        .main-title {
            text-align: center;
            opacity: 0;
            transform: translateY(2rem);
            animation: fadeInUp 1s ease-out 0.2s forwards;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .brand-logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 0.65rem;
        }

        .brand-planet-logo {
            width: clamp(100px, 15vw, 155px);
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 16px rgba(230, 180, 240, 0.8))
                    drop-shadow(0 0 32px rgba(210, 150, 230, 0.5));
            transition: transform 300ms cubic-bezier(0.16, 1, 0.3, 1), filter 300ms ease;
            user-select: none;
            -webkit-user-drag: none;
        }

        .brand-planet-logo:hover {
            transform: scale(1.05);
            filter: drop-shadow(0 0 24px rgba(245, 195, 255, 0.95))
                    drop-shadow(0 0 45px rgba(225, 165, 245, 0.65));
        }

        .main-title h1 {
            font-family: 'Playfair Display', Georgia, Cambria, 'Times New Roman', serif;
            font-size: clamp(3.2rem, 13vw, 8.5rem);
            font-weight: 600;
            letter-spacing: -0.01em;
            line-height: 1;
            color: #f7e2f5;
            /* Pure text-shadow completely eliminates browser rectangular tile clipping */
            text-shadow: 
                0 0 12px rgba(235, 185, 245, 0.95),
                0 0 26px rgba(215, 160, 235, 0.75),
                0 0 50px rgba(185, 120, 215, 0.5),
                0 0 80px rgba(145, 75, 185, 0.3);
        }

        .main-title .subtitle {
            margin-top: 0.85rem;
            font-family: 'Plus Jakarta Sans', 'Prompt', sans-serif;
            font-size: clamp(0.7rem, 2.2vw, 0.88rem);
            font-weight: 700;
            letter-spacing: 0.38em;
            text-transform: uppercase;
            color: #d6bde0;
            text-shadow: 0 0 12px rgba(225, 175, 235, 0.75), 0 0 25px rgba(205, 145, 225, 0.4);
        }

        /* ---------- Login Card ---------- */
        .login-card {
            opacity: 0;
            transform: translateY(1.5rem);
            animation: fadeInUp 1s ease-out 0.6s forwards;

            background: rgba(24, 18, 34, 0.68);
            border: 1.5px solid rgba(225, 185, 235, 0.45);
            border-radius: 28px;
            padding: clamp(1.6rem, 4.5vw, 2.25rem) clamp(1.5rem, 5vw, 2.5rem);
            width: min(390px, 92vw);
            text-align: center;
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            box-shadow: 0 0 32px rgba(215, 165, 235, 0.22),
                        0 25px 60px rgba(0, 0, 0, 0.65),
                        inset 0 0 1px 1px rgba(255, 255, 255, 0.12);
            position: relative;
        }

        .login-card .card-title {
            font-size: clamp(1.05rem, 3.2vw, 1.2rem);
            font-weight: 700;
            color: #f1d5e7;
            letter-spacing: 0.02em;
            margin-bottom: 0.35rem;
        }

        .login-card .card-subtitle {
            font-size: clamp(0.75rem, 2.2vw, 0.82rem);
            font-weight: 400;
            color: #a78fae;
            letter-spacing: 0.02em;
            margin-bottom: 1.65rem;
        }

        /* Google button */
        .google-btn-wrapper {
            display: flex;
            justify-content: center;
        }

        .google-login-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(46, 42, 58, 0.95);
            color: #ffffff;
            padding: 12px 28px;
            border-radius: 9999px;
            font-family: inherit;
            font-size: 0.98rem;
            font-weight: 600;
            cursor: pointer;
            border: 1.5px solid rgba(230, 185, 235, 0.75);
            box-shadow: 0 0 18px rgba(220, 165, 235, 0.45);
            transition: all 200ms cubic-bezier(0.16, 1, 0.3, 1);
            user-select: none;
            text-decoration: none;
        }

        .google-login-btn:hover {
            transform: scale(1.03);
            border-color: rgba(245, 205, 250, 0.95);
            box-shadow: 0 0 28px rgba(235, 180, 245, 0.65), 0 4px 14px rgba(0, 0, 0, 0.4);
        }

        .google-login-btn:active {
            transform: scale(0.98);
        }

        /* Error message */
        #errorMessage {
            display: none;
            margin-top: 0.85rem;
            font-size: 0.78rem;
            color: #f87171;
            font-weight: 500;
        }

        /* ---------- Loading spinner ---------- */
        .spinner-wrap {
            margin-top: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
            color: #c4a9d4;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(220, 180, 230, 0.25);
            border-top-color: #f1bed8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        /* ---------- Keyframes ---------- */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(2rem); }
            to   { opacity: 1; transform: translateY(0);    }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (min-width: 768px) {
            .content-wrapper {
                gap: 2.8rem;
                padding: 2rem;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js?v=99"></script>
    <script src="login.js?v=99"></script>
</head>
<body>

    <!-- Silk Canvas -->
    <canvas id="silkCanvas"></canvas>

    <!-- Dark gradient overlay -->
    <div class="gradient-overlay"></div>

    <!-- Micro-dot texture overlay -->
    <div class="texture-overlay"></div>

    <!-- Main content -->
    <div class="content-wrapper">

        <!-- Big title with Kuromi Planet Logo -->
        <div class="main-title">
            <div class="brand-logo-container">
                <img src="assets/kuromi_planet_logo.png" class="brand-planet-logo" alt="BEC BA 69 Kuromi Logo" />
            </div>
            <h1>BEC BA 69</h1>
            <div class="subtitle">FINANCIAL SYSTEM</div>
        </div>

        <!-- Login card -->
        <div class="login-card">
            <p class="card-title">ยินดีต้อนรับ</p>
            <p class="card-subtitle">กรุณายืนยันตัวตนเพื่อเข้าสู่ระบบ</p>

            <!-- Google OAuth -->
            <div class="google-btn-wrapper">
                <div class="google-login-btn" onclick="signInWithGoogle()">
                    <svg width="22" height="22" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                    <span>เข้าสู่ระบบด้วย Google</span>
                </div>
            </div>

            <div class="spinner-wrap" id="loadingHint">
                <div class="spinner"></div>
                <span>กำลังเตรียมระบบ...</span>
            </div>

            <!-- Error -->
            <p id="errorMessage"></p>
        </div>

    </div>

    <!-- Silk Canvas Animation Script -->
    <script>
        (function () {
            const canvas = document.getElementById('silkCanvas');
            const ctx = canvas.getContext('2d');
            let time = 0;
            const speed = 0.02;
            const scale = 2;
            const noiseIntensity = 0.8;
            let animId;

            function resize() {
                canvas.width  = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            function noise(x, y) {
                const G = 2.71828;
                const rx = G * Math.sin(G * x);
                const ry = G * Math.sin(G * y);
                return (rx * ry * (1 + x)) % 1;
            }

            function animate() {
                const w = canvas.width;
                const h = canvas.height;

                // Background gradient with deep obsidian and dark mauve/violet
                const bg = ctx.createLinearGradient(0, 0, w, h);
                bg.addColorStop(0,   '#0c0a10');
                bg.addColorStop(0.35,'#201529');
                bg.addColorStop(0.7, '#140e1b');
                bg.addColorStop(1,   '#09070c');
                ctx.fillStyle = bg;
                ctx.fillRect(0, 0, w, h);

                // Silk pixels with soft purple/lavender ripples
                const imgData = ctx.createImageData(w, h);
                const d = imgData.data;
                const tOff = speed * time;

                for (let y = 0; y < h; y += 2) {
                    for (let x = 0; x < w; x += 2) {
                        const nx = x / w * scale;
                        const ny = y / h * scale;

                        const pattern = Math.sin(
                            nx * 3 + Math.sin(ny * 2 + tOff) * 1.5 +
                            Math.cos(nx * 2 - tOff * 0.7) * 1.2
                        );

                        const rnd = noise(x, y);
                        const intensity = Math.max(0, pattern - rnd / 15.0 * noiseIntensity);

                        const r = Math.floor(180 * intensity);
                        const g = Math.floor(140 * intensity);
                        const b = Math.floor(205 * intensity);

                        const idx = (y * w + x) * 4;
                        if (idx < d.length) {
                            d[idx]     = r;
                            d[idx + 1] = g;
                            d[idx + 2] = b;
                            d[idx + 3] = 255;
                        }
                    }
                }
                ctx.putImageData(imgData, 0, 0);

                // Radial depth overlay
                const ov = ctx.createRadialGradient(
                    w/2, h/2, 0,
                    w/2, h/2, Math.max(w, h) / 1.5
                );
                ov.addColorStop(0, 'rgba(12, 10, 16, 0.2)');
                ov.addColorStop(1, 'rgba(9, 7, 12, 0.75)');
                ctx.fillStyle = ov;
                ctx.fillRect(0, 0, w, h);

                time++;
                animId = requestAnimationFrame(animate);
            }

            animate();
        })();

        // Hide the "loading" hint once Google button appears
        window.addEventListener('load', function () {
            setTimeout(function () {
                const hint = document.getElementById('loadingHint');
                if (hint) hint.style.display = 'none';
            }, 1800);
        });

        // Supabase Auth Logic
        async function signInWithGoogle() {
            const btnWrap = document.querySelector('.google-btn-wrapper');
            if (btnWrap) btnWrap.style.display = 'none';
            
            const loadingHint = document.getElementById('loadingHint');
            if(loadingHint) {
                loadingHint.innerHTML = '<div class="spinner"></div><span>กำลังพาท่านไปหน้าล็อกอิน...</span>';
                loadingHint.style.display = 'flex';
            }

            const { error } = await window.myAppDb.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.origin
                }
            });

            if (error) {
                console.error('Error logging in:', error.message);
                if (btnWrap) btnWrap.style.display = 'flex';
                if(loadingHint) loadingHint.style.display = 'none';
                document.getElementById('errorMessage').textContent = 'เกิดข้อผิดพลาดในการเข้าสู่ระบบ';
                document.getElementById('errorMessage').style.display = 'block';
            }
        }

        window.addEventListener('load', async () => {
            const { data: { session } } = await window.myAppDb.auth.getSession();
            
            if (session) {
                const btnWrap = document.querySelector('.google-btn-wrapper');
                if (btnWrap) btnWrap.style.display = 'none';
                
                const loadingHint = document.getElementById('loadingHint');
                if(loadingHint) {
                    loadingHint.innerHTML = '<div class="spinner"></div><span>กำลังตรวจสอบข้อมูล...</span>';
                    loadingHint.style.display = 'flex';
                }

                if (typeof handleSupabaseSession === 'function') {
                    handleSupabaseSession(session);
                }
            } else {
                window.myAppDb.auth.onAuthStateChange((event, session) => {
                    if (event === 'SIGNED_IN' && session) {
                        const btnWrap = document.querySelector('.google-btn-wrapper');
                        if (btnWrap) btnWrap.style.display = 'none';
                        
                        const loadingHint = document.getElementById('loadingHint');
                        if(loadingHint) {
                            loadingHint.innerHTML = '<div class="spinner"></div><span>กำลังตรวจสอบข้อมูล...</span>';
                            loadingHint.style.display = 'flex';
                        }
                        if (typeof handleSupabaseSession === 'function') {
                            handleSupabaseSession(session);
                        }
                    }
                });
            }
        });
    </script>
</body>
</html>
