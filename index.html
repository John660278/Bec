<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - Business NU 69</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <script>
        // ถ้าเปิดผ่านแอป LINE ให้บังคับเด้งไป Safari/Chrome อัตโนมัติ
        if (navigator.userAgent.indexOf("Line") > -1) {
            if (window.location.search.indexOf("openExternalBrowser=1") === -1) {
                window.location.href = window.location.href + (window.location.href.indexOf('?') > -1 ? '&' : '?') + "openExternalBrowser=1";
            }
        }
    </script>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Plus Jakarta Sans', 'Prompt', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f8fafc;
            color: #0f172a;
            -webkit-font-smoothing: antialiased;
        }

        /* Ambient subtle background glow */
        .ambient-bg {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at 50% 15%, rgba(226, 232, 240, 0.7) 0%, transparent 60%),
                radial-gradient(circle at 85% 85%, rgba(241, 245, 249, 0.9) 0%, transparent 50%),
                radial-gradient(circle at 15% 80%, rgba(241, 245, 249, 0.9) 0%, transparent 50%);
            z-index: 0;
        }

        /* Center content */
        .content-wrapper {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            gap: 1.75rem;
        }

        /* Title */
        .main-title {
            text-align: center;
            opacity: 0;
            transform: translateY(1.5rem);
            animation: fadeInUp 0.8s ease-out 0.1s forwards;
        }

        .main-title h1 {
            font-size: clamp(2.4rem, 8vw, 4.5rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.1;
            color: #0f172a;
        }

        .main-title .subtitle {
            margin-top: 0.5rem;
            font-size: clamp(0.72rem, 2vw, 0.85rem);
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #64748b;
        }

        /* Login Card */
        .login-card {
            opacity: 0;
            transform: translateY(1.5rem);
            animation: fadeInUp 0.8s ease-out 0.3s forwards;

            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: clamp(1.5rem, 5vw, 2.25rem);
            width: min(380px, 92vw);
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.04), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
        }

        .login-card .card-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 0.3rem;
            letter-spacing: -0.01em;
        }

        .login-card .card-subtitle {
            font-size: 0.8rem;
            font-weight: 400;
            color: #64748b;
            margin-bottom: 1.5rem;
        }

        /* Google button */
        .google-btn-wrapper {
            display: flex;
            justify-content: center;
        }

        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 0.88rem;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: all 140ms ease;
            box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.12);
            user-select: none;
        }
        .google-btn:hover {
            background: #1e293b;
            transform: translateY(-1px);
        }
        .google-btn:active {
            transform: scale(0.98);
        }

        /* Error message */
        #errorMessage {
            display: none;
            margin-top: 0.85rem;
            font-size: 0.78rem;
            color: #e11d48;
            font-weight: 500;
        }

        /* Loading spinner */
        .spinner-wrap {
            margin-top: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            color: #64748b;
            font-size: 0.78rem;
            font-weight: 500;
        }

        .spinner {
            width: 15px;
            height: 15px;
            border: 2px solid #cbd5e1;
            border-top-color: #0f172a;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(1.5rem); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Preview Demo Bar */
        .preview-box {
            margin-top: 1.5rem;
            padding-top: 1.25rem;
            border-top: 1px solid #f1f5f9;
        }
        .preview-label {
            font-size: 0.72rem;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.75rem;
        }
        .preview-btns {
            display: flex;
            gap: 8px;
        }
        .preview-btn {
            flex: 1;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            background: #f8fafc;
            color: #0f172a;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 120ms ease;
            font-family: inherit;
        }
        .preview-btn:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }
        .preview-btn:active {
            transform: scale(0.97);
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js?v=99"></script>
    <script src="login.js?v=99"></script>
</head>
<body>

    <!-- Ambient background -->
    <div class="ambient-bg"></div>

    <!-- Main content -->
    <div class="content-wrapper">

        <!-- Big title -->
        <div class="main-title">
            <h1>BEC BA 69</h1>
            <div class="subtitle">ระบบการเงินสาขาบริหารธุรกิจ</div>
        </div>

        <!-- Login card -->
        <div class="login-card">
            <p class="card-title">ยินดีต้อนรับ</p>
            <p class="card-subtitle">กรุณายืนยันตัวตนเพื่อเข้าสู่ระบบ</p>

            <!-- Google OAuth -->
            <div class="google-btn-wrapper" onclick="signInWithGoogle()">
                <div class="google-btn">
                    <svg width="20" height="20" viewBox="0 0 48 48" style="margin-right:10px;"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                    เข้าสู่ระบบด้วย Google
                </div>
            </div>

            <div class="spinner-wrap" id="loadingHint" style="display:none">
                <div class="spinner"></div>
                <span>กำลังเตรียมระบบ...</span>
            </div>

            <!-- Error -->
            <p id="errorMessage"></p>

            <!-- Preview Demo Shortcut -->
            <div class="preview-box">
                <div class="preview-label">ทดลองดูหน้าตาเว็บ (UI Preview)</div>
                <div class="preview-btns">
                    <button class="preview-btn" onclick="enterDemo('Student')">หน้านิสิต</button>
                    <button class="preview-btn" onclick="enterDemo('Admin')">หน้าแอดมิน</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        function enterDemo(role) {
            const user = role === 'Admin'
                ? { name: 'Admin (ตัวอย่างทดสอบ)', email: 'admin@nu.ac.th', role: 'Admin' }
                : { name: 'นิสิต (ตัวอย่างทดสอบ)', email: 'student@nu.ac.th', role: 'Student', studentId: '66000000' };
            sessionStorage.setItem('loggedInUser', JSON.stringify(user));
            window.location.href = role === 'Admin' ? 'admin_dashboard.html' : 'student_dashboard.html';
        }

        // Supabase Auth Logic
        async function signInWithGoogle() {
            const btnWrap = document.querySelector('.google-btn-wrapper');
            if (btnWrap) btnWrap.style.display = 'none';
            
            const loadingHint = document.getElementById('loadingHint');
            if(loadingHint) {
                loadingHint.innerHTML = '<div class="spinner"></div><span>กำลังพาท่านไปหน้าล็อกอิน...</span>';
                loadingHint.style.display = 'flex';
            }

            const { error } = await window.myAppDb.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.origin
                }
            });

            if (error) {
                console.error('Error logging in:', error.message);
                if (btnWrap) btnWrap.style.display = 'flex';
                if(loadingHint) loadingHint.style.display = 'none';
                document.getElementById('errorMessage').textContent = 'เกิดข้อผิดพลาดในการเข้าสู่ระบบ';
                document.getElementById('errorMessage').style.display = 'block';
            }
        }

        window.addEventListener('load', async () => {
            const { data: { session } } = await window.myAppDb.auth.getSession();
            
            if (session) {
                const btnWrap = document.querySelector('.google-btn-wrapper');
                if (btnWrap) btnWrap.style.display = 'none';
                
                const loadingHint = document.getElementById('loadingHint');
                if(loadingHint) {
                    loadingHint.innerHTML = '<div class="spinner"></div><span>กำลังตรวจสอบข้อมูล...</span>';
                    loadingHint.style.display = 'flex';
                }

                if (typeof handleSupabaseSession === 'function') {
                    handleSupabaseSession(session);
                }
            } else {
                window.myAppDb.auth.onAuthStateChange((event, session) => {
                    if (event === 'SIGNED_IN' && session) {
                        const btnWrap = document.querySelector('.google-btn-wrapper');
                        if (btnWrap) btnWrap.style.display = 'none';
                        
                        const loadingHint = document.getElementById('loadingHint');
                        if(loadingHint) {
                            loadingHint.innerHTML = '<div class="spinner"></div><span>กำลังตรวจสอบข้อมูล...</span>';
                            loadingHint.style.display = 'flex';
                        }

                        if (typeof handleSupabaseSession === 'function') {
                            handleSupabaseSession(session);
                        }
                    }
                });
            }
        });
    </script>
</body>
</html>
