<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - ระบบจัดการอัจฉริยะ</title>
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --foreground-rgb: 0, 0, 0;
            --background-rgb: 255, 255, 255;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --foreground-rgb: 255, 255, 255;
                --background-rgb: 0, 0, 0;
            }
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: rgb(var(--background-rgb));
            color: rgb(var(--foreground-rgb));
            min-height: 200vh;
            overflow-x: hidden;
        }

        .scroll-container {
            height: 120vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            position: relative;
            padding: 2rem;
            padding-top: 100px;
        }

        .perspective-wrapper {
            width: 100%;
            position: relative;
            perspective: 1000px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-content {
            max-width: 1024px;
            margin: 0 auto;
            text-align: center;
            will-change: transform;
            z-index: 10;
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .highlight-text {
            font-size: 4.5rem;
            font-weight: 800;
            color: #2563eb;
            line-height: 1;
            display: block;
            margin-bottom: 2rem;
        }

        /* Card Animation Styles (หน้าจอไอแพด) */
        .animated-card {
            max-width: 1024px;
            margin-top: 1rem;
            margin-left: auto;
            margin-right: auto;
            height: 45rem;
            width: 100%;
            border: 4px solid #6C6C6C;
            padding: 1.25rem;
            background-color: #222222;
            border-radius: 30px;
            box-shadow: 0 0 #0000004d, 0 9px 20px #0000004a, 0 37px 37px #00000042, 0 84px 50px #00000026, 0 149px 60px #0000000a, 0 233px 65px #00000003;
            transform-origin: top center;
            will-change: transform;
            z-index: 1;
        }

        /* ข้างในหน้าจอ */
        .card-inner {
            height: 100%;
            width: 100%;
            overflow: hidden;
            border-radius: 1rem;
            background-color: #18181b;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* รูปภาพพื้นหลังของไอแพด */
        .card-inner img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            z-index: 0;
            filter: brightness(0.6) blur(2px);
        }

        /* กล่อง Login (ลอยอยู่ตรงกลางจอ) */
        .login-box {
            position: relative;
            z-index: 10;
            background-color: rgba(255, 255, 255, 0.95);
            padding: 2.5rem 3rem;
            border-radius: 1.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #1f2937;
            backdrop-filter: blur(10px);
        }

        .login-box h2 {
            margin-top: 0;
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
            font-weight: 700;
        }

        .login-box p.subtitle {
            margin-top: 0;
            margin-bottom: 2rem;
            color: #6b7280;
            font-size: 1rem;
        }

        @media (prefers-color-scheme: dark) {
            .login-box {
                background-color: rgba(24, 24, 27, 0.85);
                color: #f3f4f6;
                border: 1px solid rgba(255,255,255,0.1);
            }
            .login-box p.subtitle {
                color: #9ca3af;
            }
        }

        .error-message {
            color: #ef4444;
            margin-top: 1rem;
            font-size: 0.875rem;
            display: none;
            font-weight: 500;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="scroll-container">
        <div class="perspective-wrapper">
            
            <div class="header-content" id="headerContent">
                <h1>ระบบจัดการเงิน</h1>
                <span class="highlight-text">Business NU 69</span>
            </div>

            <!-- หน้าจอไอแพด -->
            <div class="animated-card" id="animatedCard">
                <div class="card-inner">
                    <!-- พื้นหลังไอแพด -->
                    <img src="https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&q=80&w=3840" alt="Dashboard Cover" draggable="false">
                    
                    <!-- กล่องสำหรับ Login (ลอยอยู่ตรงกลางจอ) -->
                    <div class="login-box">
                        <h2>ยินดีต้อนรับ</h2>
                        <p class="subtitle">กรุณายืนยันตัวตนเพื่อเข้าสู่ระบบ</p>
                        
                        <!-- จุดเชื่อมต่อ Google OAuth -->
                        <div id="g_id_onload"
                            data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
                            data-context="signin"
                            data-ux_mode="popup"
                            data-callback="handleCredentialResponse"
                            data-auto_prompt="false">
                        </div>

                        <div class="g_id_signin"
                            data-type="standard"
                            data-shape="rectangular"
                            data-theme="outline"
                            data-text="signin_with"
                            data-size="large"
                            data-logo_alignment="center">
                        </div>

                        <!-- กล่องแสดง Error โดยเชื่อมกับ login.js ผ่าน id="errorMessage" -->
                        <p id="errorMessage" class="error-message"></p>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <!-- สคริปต์ควบคุมอนิเมชั่น UI -->
    <script>
        const header = document.getElementById('headerContent');
        const card = document.getElementById('animatedCard');
        
        function updateAnimation() {
            const scrollY = window.scrollY;
            const maxScroll = window.innerHeight * 0.8;
            let progress = Math.min(scrollY / maxScroll, 1);
            
            const isMobile = window.innerWidth <= 768;
            const startScale = isMobile ? 0.7 : 1.05;
            const endScale = isMobile ? 0.9 : 1;
            
            const rotateX = 20 - (progress * 20);
            const scale = startScale + (progress * (endScale - startScale));
            const translateY = progress * -100;
            
            header.style.transform = `translateY(${translateY}px)`;
            card.style.transform = `rotateX(${rotateX}deg) scale(${scale})`;
        }

        window.addEventListener('scroll', () => requestAnimationFrame(updateAnimation));
        window.addEventListener('resize', () => requestAnimationFrame(updateAnimation));
        updateAnimation();
    </script>

    <!-- นำเข้าไฟล์ระบบจัดการ Login (เพื่อเก็บแยกโค้ดให้สะอาดตา) -->
    <script src="login.js"></script>

</body>
</html>
