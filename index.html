<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - Business NU 69</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: ui-serif, Georgia, Cambria, "Times New Roman", Times, serif;
            background: #000;
        }

        /* ---------- Canvas ---------- */
        #silkCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* ---------- Overlays ---------- */
        .gradient-overlay {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: linear-gradient(to bottom, rgba(0,0,0,.35) 0%, transparent 50%, rgba(0,0,0,.55) 100%);
        }

        /* ---------- Corner label ---------- */
        .corner-label {
            position: absolute;
            top: 1.75rem;
            left: 1.75rem;
            z-index: 30;
            font-size: 0.65rem;
            font-weight: 300;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: rgba(156,163,175,.45);
            opacity: 0;
            transform: translateY(-1rem);
            animation: fadeInCorner 1s ease-out 1.1s forwards;
        }

        /* ---------- Center content ---------- */
        .content-wrapper {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            gap: 1.5rem;  /* ลดระยะห่างระหว่าง title กับ card บนมือถือ */
        }

        /* ---------- Title ---------- */
        .main-title {
            text-align: center;
            opacity: 0;
            transform: translateY(2rem);
            animation: fadeInUp 1s ease-out 0.2s forwards;
        }

        .main-title h1 {
            /* clamp(ขั้นต่ำ, preferred, ขั้นสูง) 
               - มือถือเล็ก (320px) → ~2.8rem
               - มือถือ (390px)    → ~3.5rem
               - iPad              → ~6rem
               - Desktop           → สูงสุด 9rem  */
            font-size: clamp(2.8rem, 12vw, 9rem);
            font-weight: 300;
            letter-spacing: -0.04em;
            line-height: 1;
            color: #fff;
            mix-blend-mode: difference;
            text-shadow: 0 0 60px rgba(255,255,255,.1);
        }

        .main-title .subtitle {
            margin-top: 0.6rem;
            font-size: clamp(0.55rem, 2.2vw, 0.85rem);
            font-weight: 200;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: rgba(209,213,219,.75);
        }

        .main-title .subtitle span:not(.dot) {
            display: inline-block;
        }

        .main-title .subtitle .dot {
            margin: 0 0.5rem;
            color: rgba(107,114,128,.7);
        }

        /* ---------- Login Card ---------- */
        .login-card {
            opacity: 0;
            transform: translateY(1.5rem);
            animation: fadeInUp 1s ease-out 0.6s forwards;

            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 1.25rem;
            /* padding แบบ responsive: เล็กบนมือถือ ใหญ่บน desktop */
            padding: clamp(1.25rem, 4vw, 2rem) clamp(1.25rem, 5vw, 2.25rem);
            width: min(340px, 88vw);   /* ไม่เกิน 88% ของหน้าจอ */
            text-align: center;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: 0 25px 60px rgba(0,0,0,.5);
        }

        .login-card .card-title {
            font-size: clamp(0.95rem, 3vw, 1.1rem);
            font-weight: 400;
            color: rgba(243,244,246,.9);
            letter-spacing: 0.04em;
            margin-bottom: 0.3rem;
        }

        .login-card .card-subtitle {
            font-size: clamp(0.68rem, 2vw, 0.75rem);
            font-weight: 200;
            color: rgba(156,163,175,.7);
            letter-spacing: 0.06em;
            margin-bottom: clamp(1.25rem, 3vw, 1.75rem);
            font-family: ui-sans-serif, system-ui, sans-serif;
        }

        /* Google button wrapper */
        .google-btn-wrapper {
            display: flex;
            justify-content: center;
        }

        /* Error message */
        #errorMessage {
            display: none;
            margin-top: 0.85rem;
            font-size: 0.75rem;
            color: #f87171;
            font-family: ui-sans-serif, system-ui, sans-serif;
            letter-spacing: 0.02em;
            font-weight: 400;
        }

        /* ---------- Loading spinner ---------- */
        .spinner-wrap {
            margin-top: 0.65rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
            color: rgba(156,163,175,.5);
            font-size: 0.65rem;
            font-family: ui-sans-serif, system-ui, sans-serif;
            letter-spacing: 0.1em;
        }

        .spinner {
            width: 13px;
            height: 13px;
            border: 1.5px solid rgba(156,163,175,.3);
            border-top-color: rgba(156,163,175,.8);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        /* ---------- Keyframes ---------- */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(2rem); }
            to   { opacity: 1; transform: translateY(0);    }
        }

        @keyframes fadeInCorner {
            from { opacity: 0; transform: translateY(-1rem); }
            to   { opacity: 1; transform: translateY(0);     }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ---------- ปรับ gap ให้ใหญ่ขึ้นบน desktop ---------- */
        @media (min-width: 768px) {
            .content-wrapper {
                gap: 3rem;
                padding: 2rem;
            }
        }

    </style>
</head>
<body>

    <!-- Silk Canvas -->
    <canvas id="silkCanvas"></canvas>

    <!-- Dark gradient overlay -->
    <div class="gradient-overlay"></div>

    <!-- Corner label -->
    <div class="corner-label">Business NU 69</div>

    <!-- Main content -->
    <div class="content-wrapper">

        <!-- Big title -->
        <div class="main-title">
            <h1>NU BEC</h1>
            <div class="subtitle">
                <span>ระบบการเงิน</span>
                <span class="dot">•</span>
                <span>สาขาวิชา</span>
                <span class="dot">•</span>
                <span>69</span>
            </div>
        </div>

        <!-- Login card -->
        <div class="login-card">
            <p class="card-title">ยินดีต้อนรับ</p>
            <p class="card-subtitle">กรุณายืนยันตัวตนเพื่อเข้าสู่ระบบ</p>

            <!-- Google OAuth -->
            <div id="g_id_onload"
                data-client_id="160108356601-3u5fsjc24251mastsditc6p9c914bqpd.apps.googleusercontent.com"
                data-context="signin"
                data-ux_mode="popup"
                data-callback="handleCredentialResponse"
                data-auto_prompt="false">
            </div>

            <div class="google-btn-wrapper">
                <div class="g_id_signin"
                    data-type="standard"
                    data-shape="pill"
                    data-theme="filled_black"
                    data-text="signin_with"
                    data-size="large"
                    data-logo_alignment="center">
                </div>
            </div>

            <div class="spinner-wrap" id="loadingHint">
                <div class="spinner"></div>
                <span>กำลังเตรียมระบบ...</span>
            </div>

            <!-- Error -->
            <p id="errorMessage"></p>
        </div>

    </div>

    <!-- Silk Canvas Animation Script -->
    <script>
        (function () {
            const canvas = document.getElementById('silkCanvas');
            const ctx = canvas.getContext('2d');
            let time = 0;
            const speed = 0.02;
            const scale = 2;
            const noiseIntensity = 0.8;
            let animId;

            function resize() {
                canvas.width  = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            function noise(x, y) {
                const G = 2.71828;
                const rx = G * Math.sin(G * x);
                const ry = G * Math.sin(G * y);
                return (rx * ry * (1 + x)) % 1;
            }

            function animate() {
                const w = canvas.width;
                const h = canvas.height;

                // Background gradient
                const bg = ctx.createLinearGradient(0, 0, w, h);
                bg.addColorStop(0,   '#1a1a1a');
                bg.addColorStop(0.5, '#2a2a2a');
                bg.addColorStop(1,   '#1a1a1a');
                ctx.fillStyle = bg;
                ctx.fillRect(0, 0, w, h);

                // Silk pixels (step 2 for performance)
                const imgData = ctx.createImageData(w, h);
                const d = imgData.data;
                const tOff = speed * time;

                for (let x = 0; x < w; x += 2) {
                    for (let y = 0; y < h; y += 2) {
                        const u = (x / w) * scale;
                        const v = (y / h) * scale;
                        const tex_x = u;
                        const tex_y = v + 0.03 * Math.sin(8.0 * tex_x - tOff);

                        const pattern = 0.6 + 0.4 * Math.sin(
                            5.0 * (tex_x + tex_y +
                                Math.cos(3.0 * tex_x + 5.0 * tex_y) +
                                0.02 * tOff) +
                            Math.sin(20.0 * (tex_x + tex_y - 0.1 * tOff))
                        );

                        const rnd = noise(x, y);
                        const intensity = Math.max(0, pattern - rnd / 15.0 * noiseIntensity);

                        const r = Math.floor(123 * intensity);
                        const g = Math.floor(116 * intensity);
                        const b = Math.floor(129 * intensity);

                        const idx = (y * w + x) * 4;
                        if (idx < d.length) {
                            d[idx]     = r;
                            d[idx + 1] = g;
                            d[idx + 2] = b;
                            d[idx + 3] = 255;
                        }
                    }
                }
                ctx.putImageData(imgData, 0, 0);

                // Radial depth overlay
                const ov = ctx.createRadialGradient(
                    w/2, h/2, 0,
                    w/2, h/2, Math.max(w, h) / 2
                );
                ov.addColorStop(0, 'rgba(0,0,0,0.1)');
                ov.addColorStop(1, 'rgba(0,0,0,0.42)');
                ctx.fillStyle = ov;
                ctx.fillRect(0, 0, w, h);

                time++;
                animId = requestAnimationFrame(animate);
            }

            animate();
        })();

        // Hide the "loading" hint once Google button appears
        window.addEventListener('load', function () {
            setTimeout(function () {
                const hint = document.getElementById('loadingHint');
                if (hint) hint.style.display = 'none';
            }, 1800);
        });
    </script>

    <!-- Login logic -->
    <script src="login.js"></script>

</body>
</html>
