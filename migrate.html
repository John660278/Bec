<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Migration Tool - ย้ายข้อมูลลง Firebase</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <style>
    body { font-family: ui-sans-serif, system-ui, sans-serif; padding: 2rem; background: #f0f2f5; }
    .card { background: white; padding: 2rem; border-radius: 12px; max-width: 600px; margin: auto; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; }
    h2 { margin-top: 0; color: #111; }
    p { color: #666; margin-bottom: 2rem; }
    button { padding: 12px 24px; font-size: 16px; font-weight: bold; background: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    #log { margin-top: 1.5rem; padding: 1rem; background: #1e293b; color: #10b981; border-radius: 8px; font-family: monospace; font-size: 14px; max-height: 300px; overflow-y: auto; text-align: left; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🚀 เครื่องมือย้ายข้อมูลเก่า (Migration)</h2>
    <p>ระบบจะดึง รายรับ, รายจ่าย, อีเวนต์เก็บเงิน และประวัติส่งสลิปทั้งหมดจาก Google Sheet มาใส่ใน Firebase แบบอัตโนมัติ</p>
    <button id="startBtn" onclick="startMigration()">เริ่มโอนย้ายข้อมูลทันที</button>
    <div id="log">รอคำสั่ง...</div>
  </div>

  <script>
    // ==========================================
    // ⚠️ เอาโค้ด firebaseConfig ของคุณ มาวางทับตรงนี้ครับ ⚠️
    // ==========================================
const firebaseConfig = {
  apiKey: "AIzaSyA1Zuhs25HvceVZYpErBuqzhrrTZfN1Z0k",
  authDomain: "bec-admin-80e83.firebaseapp.com",
  projectId: "bec-admin-80e83",
  storageBucket: "bec-admin-80e83.firebasestorage.app",
  messagingSenderId: "1089372941715",
  appId: "1:1089372941715:web:880b6f08cdaded6b804c66"
};
    
    // ตั้งค่า Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwMnLEpGSYmdqeQTgU5s4vtVTRKhhAC594wcF-wycBuJqy4tB-XOxi6xAsP6TXPUuy4ew/exec";

    function logMsg(msg) {
      const logDiv = document.getElementById('log');
      logDiv.innerHTML += `<div>${msg}</div>`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    async function startMigration() {
      if(!firebaseConfig.apiKey || firebaseConfig.apiKey === "YOUR_API_KEY") {
        alert("อย่าลืมวางโค้ด firebaseConfig ก่อนนะครับ!");
        return;
      }

      document.getElementById('startBtn').disabled = true;
      logMsg("🔄 กำลังเริ่มดึงข้อมูลจาก Google Sheet...");
      
      try {
        const [evRes, payRes, pubRes, userRes, matrixRes] = await Promise.all([
          fetch(`${SCRIPT_URL}?action=getEvents`),
          fetch(`${SCRIPT_URL}?action=getAllPayments`),
          fetch(`${SCRIPT_URL}?action=getPublicDashboard`),
          fetch(`${SCRIPT_URL}?action=getAllUsers`),
          fetch(`${SCRIPT_URL}?action=getStudentMatrix`)
        ]);
        
        const evData = await evRes.json();
        const payData = await payRes.json();
        const pubData = await pubRes.json();
        const userData = await userRes.json();
        const matrixData = await matrixRes.json();

        logMsg("✅ ดึงข้อมูลสำเร็จ! กำลังเริ่มบันทึกลง Firebase...");

        // 1. Incomes
        if (pubData.incomes && pubData.incomes.length > 0) {
          logMsg(`📥 กำลังโอนย้าย รายรับ (${pubData.incomes.length} รายการ)...`);
          for (const item of pubData.incomes) {
            if (!item.source) continue; 
            await db.collection('incomes').add({
              source: item.source,
              amount: Number(item.amount),
              date: item.date,
              receiptUrl: item.receiptUrl || '',
              timestamp: firebase.firestore.FieldValue.serverTimestamp(),
              isMigrated: true
            });
          }
        }

        // 2. Expenses
        if (pubData.expenses && pubData.expenses.length > 0) {
          logMsg(`📤 กำลังโอนย้าย รายจ่าย (${pubData.expenses.length} รายการ)...`);
          for (const item of pubData.expenses) {
            if (!item.title) continue;
            await db.collection('expenses').add({
              title: item.title,
              amount: Number(item.amount),
              date: item.date,
              receiptUrl: item.receiptUrl || '',
              timestamp: firebase.firestore.FieldValue.serverTimestamp(),
              isMigrated: true
            });
          }
        }

        // 3. Events
        if (evData.events && evData.events.length > 0) {
          logMsg(`📅 กำลังโอนย้าย อีเวนต์เก็บเงิน (${evData.events.length} รายการ)...`);
          for (const item of evData.events) {
            if (!item.eventId) continue;
            await db.collection('events').doc(item.eventId).set({
              eventId: item.eventId,
              title: item.title,
              baseAmount: Number(item.baseAmount),
              dueDate: item.dueDate,
              createdAt: item.createdAt,
              isMigrated: true
            });
          }
        }

        // 4. Payments
        if (payData.payments && payData.payments.length > 0) {
          logMsg(`💸 กำลังโอนย้าย ประวัติการส่งสลิป (${payData.payments.length} รายการ)...`);
          for (const item of payData.payments) {
            if (!item.paymentId) continue;
            await db.collection('payments').doc(item.paymentId).set({
              paymentId: item.paymentId,
              eventId: item.eventId,
              email: item.email,
              name: item.name,
              paidAmount: Number(item.paidAmount),
              penalty: Number(item.penalty),
              status: item.status,
              slipUrl: item.slipUrl || '',
              paidAt: item.paidAt,
              isMigrated: true
            });
          }
        }

        // 5. Users
        if (userData.users && userData.users.length > 0) {
          logMsg(`👥 กำลังโอนย้าย รายชื่อผู้ใช้งาน (${userData.users.length} รายการ)...`);
          for (const u of userData.users) {
            if (!u.email) continue;
            const docId = u.email.replace(/[^a-zA-Z0-9]/g, '_');
            await db.collection('users').doc(docId).set({
              email: u.email,
              studentId: String(u.studentId),
              name: u.name,
              role: u.role,
              isMigrated: true
            });
          }
        }

        // 6. Student Matrix
        if (matrixData.headers && matrixData.headers.length > 0) {
          logMsg(`📊 กำลังโอนย้าย ตารางสถานะ Matrix...`);
          await db.collection('student_matrix').doc('current').set({
            headers: matrixData.headers,
            rows: matrixData.rows,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        }

        logMsg("🎉 โอนย้ายข้อมูลทั้งหมดเสร็จสมบูรณ์ 100%!");
        alert("โอนย้ายข้อมูลสำเร็จเรียบร้อยแล้วครับ!");

      } catch (e) {
        console.error(e);
        logMsg(`<span style="color:#ef4444">❌ เกิดข้อผิดพลาด: ${e.message}</span>`);
        alert("เกิดข้อผิดพลาด ดูรายละเอียดที่หน้าต่างสีดำครับ");
      }
    }
  </script>
</body>
</html>
