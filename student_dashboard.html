<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — BEC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
  window.filterPbMatrix = function() {
    const term = document.getElementById('pbMatrixSearch').value.toLowerCase();
    const rows = document.querySelectorAll('.pb-matrix-row');
    rows.forEach(row => {
      const text = row.textContent.toLowerCase();
      row.style.display = text.includes(term) ? '' : 'none';
    });
  };
</script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #f8fafc;
      --surface:     #ffffff;
      --surface2:    #f1f5f9;
      --border:      #e2e8f0;
      --border2:     #cbd5e1;
      --text:        #0f172a;
      --muted:       #64748b;
      --muted2:      #94a3b8;
      --accent:      #0f172a;
      --accent-text: #ffffff;
      --danger:      #e11d48;
      --shadow-sm:   0 1px 3px rgba(0,0,0,0.03), 0 1px 2px rgba(0,0,0,0.02);
      --shadow-md:   0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -2px rgba(0,0,0,0.03);
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', 'Prompt', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── NAV ─── */
    .topnav {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 1.5rem;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-logo {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .nav-logo span {
      font-size: 0.68rem;
      font-weight: 500;
      color: var(--muted);
      margin-left: 0.5rem;
      letter-spacing: 0.02em;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .nav-avatar {
      width: 32px; height: 32px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; font-weight: 600;
      color: var(--text);
      overflow: hidden;
    }
    .nav-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .nav-name {
      font-size: 0.8rem;
      color: var(--text);
      font-weight: 600;
    }
    .nav-logout {
      background: none; border: 1px solid var(--border); cursor: pointer;
      color: var(--muted); display: flex; padding: 5px;
      border-radius: 6px; transition: all 120ms;
    }
    .nav-logout:hover { color: var(--danger); border-color: #fecdd3; background: #fff1f2; }

    /* ─── HERO ─── */
    .hero {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1.75rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .hero-left { display: flex; align-items: center; gap: 1rem; }
    .hero-avatar {
      width: 58px; height: 58px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--text);
      flex-shrink: 0;
      overflow: hidden;
    }
    .hero-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .hero-name { font-size: 1.15rem; font-weight: 700; color: var(--text); letter-spacing: -0.01em; }
    .hero-meta { font-size: 0.75rem; color: var(--muted); margin-top: 0.2rem; }

    .hero-right { text-align: right; flex-shrink: 0; }
    .hero-stat-num {
      font-size: 1.85rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .hero-stat-label {
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-top: 0.35rem;
      font-weight: 600;
    }

    /* ─── TABS ─── */
    .tabs-bar {
      display: flex;
      gap: 8px;
      padding: 1.25rem 2rem 0;
    }
    .tab-pill {
      padding: 0.45rem 1.1rem;
      border-radius: 9999px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-family: inherit;
      transition: all 140ms ease;
      box-shadow: var(--shadow-sm);
    }
    .tab-pill:hover { border-color: var(--border2); color: var(--text); }
    .tab-pill.active {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
      box-shadow: 0 2px 6px rgba(15,23,42,0.12);
    }

    /* ─── CONTENT ─── */
    .content {
      padding: 1.25rem 2rem 2rem;
    }

    /* ─── PAYMENT ITEM ─── */
    .payment-list { display: flex; flex-direction: column; gap: 8px; }

    .payment-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.15rem 1.35rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      transition: all 140ms ease;
      box-shadow: var(--shadow-sm);
    }
    .payment-item:hover {
      border-color: var(--border2);
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }

    .payment-left { flex: 1; min-width: 0; }
    .payment-title {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text);
    }
    .payment-due {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 0.2rem;
    }
    .payment-penalty {
      font-size: 0.72rem;
      color: var(--danger);
      margin-top: 0.2rem;
      font-weight: 500;
    }

    .payment-mid {
      text-align: right;
      min-width: 90px;
    }
    .payment-amount {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .payment-base-label {
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 0.1rem;
    }

    .payment-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.4rem;
      min-width: 100px;
    }

    /* ─── BADGE ─── */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 9999px;
      font-size: 0.72rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .badge-unpaid  { background: #fff1f2; border: 1px solid #fecdd3; color: #e11d48; }
    .badge-pending { background: #fefce8; border: 1px solid #fef08a; color: #b45309; }
    .badge-paid    { background: #f0fdf4; border: 1px solid #bbf7d0; color: #15803d; }

    /* ─── BUTTON ─── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1.1rem;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 120ms ease;
      border: none;
      font-family: inherit;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn:active:not(:disabled) { transform: scale(0.98); }
    .btn-primary {
      background: var(--accent);
      color: var(--accent-text);
      box-shadow: 0 2px 4px rgba(15,23,42,0.12);
    }
    .btn-primary:hover:not(:disabled) {
      background: #1e293b;
      opacity: 1;
    }
    .btn-sm { padding: 0.35rem 0.75rem; font-size: 0.74rem; }

    /* ─── EMPTY STATE ─── */
    .empty-state {
      text-align: center;
      padding: 3.5rem 1rem;
      color: var(--muted);
    }
    .empty-state p { font-size: 0.85rem; font-weight: 500; }
    .empty-state small { font-size: 0.75rem; color: var(--muted2); display: block; margin-top: 0.35rem; }

    /* ─── SKELETON ─── */
    @keyframes shimmer {
      0% { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
      background-size: 800px 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 4px;
      height: 14px;
    }

    .skeleton-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.15rem 1.35rem;
      margin-bottom: 8px;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      box-shadow: var(--shadow-sm);
    }

    /* ─── MODAL ─── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      width: 100%;
      max-width: 420px;
      padding: 1.75rem;
      position: relative;
      transform: translateY(12px);
      transition: transform 180ms ease;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
    }
    .modal-overlay.open .modal { transform: translateY(0); }

    .modal-close {
      position: absolute;
      top: 1rem; right: 1rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      cursor: pointer;
      color: var(--muted);
      border-radius: 8px;
      padding: 5px;
      display: flex;
      transition: all 120ms;
    }
    .modal-close:hover { color: var(--text); background: var(--border); }

    .modal-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 0.2rem;
    }
    .modal-amount {
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 0.2rem;
    }
    .modal-penalty {
      font-size: 0.75rem;
      color: var(--danger);
      margin-bottom: 1rem;
      font-weight: 500;
    }

    .modal-divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1.25rem 0;
    }

    /* QR area */
    .qr-section { text-align: center; }
    .qr-box {
      display: inline-block;
      background: #fff;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 0.5rem;
    }
    .qr-label { font-size: 0.72rem; color: var(--muted); font-weight: 500; }

    /* File upload */
    .upload-area {
      border: 1.5px dashed var(--border2);
      background: var(--surface2);
      border-radius: 12px;
      padding: 1.5rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 150ms, background 150ms;
      margin-bottom: 0.85rem;
      position: relative;
    }
    .upload-area:hover { border-color: var(--text); background: #f8fafc; }
    .upload-area input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
      z-index: 5;
    }
    .upload-icon { color: var(--muted); margin-bottom: 0.35rem; }
    .upload-text { font-size: 0.78rem; color: var(--muted); font-weight: 500; }
    .upload-filename { font-size: 0.75rem; color: var(--text); margin-top: 0.4rem; font-weight: 600; }

    .btn-full { width: 100%; justify-content: center; padding: 0.7rem 1rem; font-size: 0.85rem; }

    /* Success state */
    .success-state {
      text-align: center;
      padding: 1.5rem 0;
      display: none;
    }
    .success-state svg { color: #16a34a; margin-bottom: 0.5rem; }
    .success-state p { font-size: 0.85rem; color: var(--text); font-weight: 600; }
    .success-state small { font-size: 0.75rem; color: var(--muted); }

    /* ─── MOBILE ─── */
    @media (max-width: 640px) {
      .hero { padding: 1.25rem 1.25rem; flex-direction: column; align-items: flex-start; }
      .hero-right { text-align: left; }
      .tabs-bar { padding: 0.75rem 1.25rem 0; }
      .content { padding: 1rem 1.25rem 5rem; }
      .payment-item { flex-wrap: wrap; gap: 0.75rem; }
      .payment-mid { text-align: left; }
      .payment-right { flex-direction: row; align-items: center; min-width: unset; width: 100%; justify-content: space-between; }
      .topnav { padding: 0 1.25rem; }
      .nav-name { display: none; }
      .modal-overlay { align-items: flex-end; padding: 0; }
      .modal { border-radius: 18px 18px 0 0; max-width: 100%; }
    }
  </style>
</head>

<!-- PAYMENT MODAL -->
<div class="modal-overlay" id="paymentModal">

      <div class="modal-title" id="modalTitle">—</div>

      <hr class="modal-divider" />

    <!-- success -->

<script>
  // ==========================================
  // โค้ด firebaseConfig 
  // ==========================================
 const db = window.db;
  // ==========================================

    const PROMPTPAY_ID  = "004999246368459"; // พร้อมเพย์ (เลขบัตรประชาชน/องค์กร)
  const BANK_ACCOUNT  = "235-1-83876-3";   // เลขบัญชี KBANK

  let currentUser = null;
  let allEvents   = [];
  let currentPayment = null;
  let publicDataFetched = false;

  // ─── INIT ───
  document.addEventListener('DOMContentLoaded', () => {
    const raw = sessionStorage.getItem('loggedInUser');
    if (!raw) { location.href = 'index.html'; return; }
    currentUser = JSON.parse(raw);

    if (currentUser.role === 'Admin') {
      location.href = 'admin_dashboard.html'; return;
    }

    // Fill nav & hero
    const initial = (currentUser.name || 'U')[0].toUpperCase();
    const pic = currentUser.picture || '';

    const navAv = document.getElementById('navAvatar');
    navAv.innerHTML = pic ? `<img src="${pic}" alt="">` : initial;
    document.getElementById('navName').textContent = currentUser.name || '';

    const heroAv = document.getElementById('heroAvatar');
    heroAv.innerHTML = pic ? `<img src="${pic}" alt="">` : `<span style="font-size:1.4rem;color:var(--muted)">${initial}</span>`;

  // ─── FETCH (Firebase) ───
  async function fetchPayments() {
    if (currentUser && currentUser.name && currentUser.name.includes('ตัวอย่าง')) {
      const demoEvents = [
        { eventId: 'demo-1', title: 'ค่าบำรุงสาขา สัปดาห์ที่ 1', baseAmount: 100, dueDate: '2026-09-01', status: 'Paid', penalty: 0, totalAmount: 100 },
        { eventId: 'demo-2', title: 'ค่าบำรุงสาขา สัปดาห์ที่ 2', baseAmount: 100, dueDate: '2026-09-08', status: 'Pending', penalty: 0, totalAmount: 100 },
        { eventId: 'demo-3', title: 'ค่าบำรุงสาขา สัปดาห์ที่ 3', baseAmount: 100, dueDate: '2026-09-15', status: 'Unpaid', penalty: 20, totalAmount: 120 }
      ];
      allEvents = demoEvents;
      document.getElementById('heroUnpaidCount').textContent = '1';
      renderList(demoEvents);
      return;
    }
    try {
      // ดึงอีเวนต์ทั้งหมดจาก Firebase
      const evSnap = await db.collection('events').get();
      const events = [];
      evSnap.forEach(doc => events.push(doc.data()));

      // ดึงประวัติการจ่ายของนิสิตคนนี้จาก Firebase
      const paySnap = await db.collection('payments')
        .where('email', '==', currentUser.email)
        .get();
      const payMap = {};
      paySnap.forEach(doc => {
        const d = doc.data();
        payMap[d.eventId] = d;
      });

      const currentDate = new Date();
      allEvents = events.map(ev => {
        const payRecord = payMap[ev.eventId];
        const dueDate = new Date(ev.dueDate);
        let status = 'Unpaid';
        if (payRecord) status = payRecord.status;

        let penalty = 0;
        if (status === 'Unpaid' && currentDate > dueDate) {
          const diffDays = Math.floor(Math.abs(currentDate - dueDate) / (1000 * 60 * 60 * 24));
          penalty = diffDays * 1;
          
          // ยกเว้นค่าปรับสำหรับสัปดาห์ที่ 1-4
          const t = ev.title.trim();
          if (t === 'สัปดาห์ที่ 1' || t === 'สัปดาห์ที่ 2' || t === 'สัปดาห์ที่ 3' || t === 'สัปดาห์ที่ 4') {
            penalty = 0;
          }
        }

        return {
          eventId: ev.eventId,
          title: ev.title,
          baseAmount: Number(ev.baseAmount),
          dueDate: ev.dueDate,
          status,
          penalty,
          totalAmount: Number(ev.baseAmount) + penalty
        };
      }).sort((a, b) => new Date(b.dueDate) - new Date(a.dueDate));

      const unpaid = allEvents.filter(e => e.status === 'Unpaid').length;
      document.getElementById('heroUnpaidCount').textContent = unpaid;
      renderList(allEvents);
    } catch (e) {
      console.error(e);
      showError('เชื่อมต่อล้มเหลว — ลองใหม่อีกครั้ง');
    }
  }

  // ─── PROMPTPAY PAYLOAD GENERATOR ───
  function generatePromptPayPayload(id, amount) {
    const f = (tag, val) => {
      val = val.toString();
      return tag + ('00' + val.length).slice(-2) + val;
    };

    // ลบอักขระพิเศษ เหลือแต่ตัวเลข
    let targetId = id.replace(/\D/g, '');

    // กำหนด tag: 01 = เบอร์โทร, 02 = เลขบัตร/นิติบุคคล
    let isPhone = targetId.length === 10;
    if (isPhone) {
      targetId = '0066' + targetId.substring(1); // แปลงเบอร์ไทยเป็น +66
    }
    // 13 หรือ 15 หลัก → tag 02 (เลขบัตรประชาชน/นิติบุคคล)

    const aid = f('00', 'A000000677010111');
    const biller = isPhone ? f('01', targetId) : f('02', targetId);
    const merchantInfo = f('29', aid + biller);
    const amountStr = amount ? f('54', Number(amount).toFixed(2)) : '';

    const payload = [
      f('00', '01'),
      f('01', amount ? '12' : '11'),
      merchantInfo,
      f('58', 'TH'),
      f('53', '764'),
      amountStr,
      '6304'
    ].join('');

    let crc = 0xFFFF;
    for (let i = 0; i < payload.length; i++) {
      crc ^= payload.charCodeAt(i) << 8;
      for (let j = 0; j < 8; j++) {
        crc = (crc & 0x8000) ? (crc << 1) ^ 0x1021 : crc << 1;
      }
    }
    return payload + (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
  }

  // ─── SUBMIT SLIP ───
  async function submitSlip() {
    const fileInput = document.getElementById('slipInput');
    if (!fileInput.files.length) {
      alert('กรุณาแนบรูปสลิปก่อน');
      return;
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="animation:spin .8s linear infinite"><path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" opacity=".3"/><path d="M21 12a9 9 0 00-9-9"/></svg> กำลังอัปโหลด...`;

    try {
      const file = fileInput.files[0];
      
      // --- ระบบบีบอัดรูปภาพก่อนอัปโหลด ---
      const compressedBlob = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let maxWidth = 800;
            let scale = 1;
            if (img.width > maxWidth) scale = maxWidth / img.width;
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            
            // แปลงเป็น Blob (JPEG 70%) ส่งตรงเข้า Supabase
            canvas.toBlob((blob) => resolve(blob), 'image/jpeg', 0.7);
          };
          img.onerror = reject;
        };
        reader.onerror = reject;
      });

      // 1. อัปโหลดรูปไปเก็บที่ Supabase Storage (แยกโฟลเดอร์ตามรอบ)
      const paymentId = crypto.randomUUID();
      const fileName = `${currentPayment.eventId}/slip_${paymentId}.jpg`;
      
      const { data: uploadData, error: uploadError } = await window.myAppDb.storage
        .from('slips')
        .upload(fileName, compressedBlob, { contentType: 'image/jpeg' });
        
      if (uploadError) {
        throw new Error('อัปโหลดรูปลง Supabase ไม่สำเร็จ: ' + uploadError.message);
      }
      
      const { data: { publicUrl } } = window.myAppDb.storage.from('slips').getPublicUrl(fileName);
      const slipUrl = publicUrl;
      

      // 2. บันทึกข้อมูลลง Firebase Firestore
      try {
        let realName = currentUser.name || '';
        try {
          const uSnap = await db.collection('users').where('email', '==', currentUser.email).limit(1).get();
          if (!uSnap.empty && uSnap.docs[0].data().name) {
            realName = uSnap.docs[0].data().name;
            currentUser.name = realName;
            sessionStorage.setItem('loggedInUser', JSON.stringify(currentUser));
          }
        } catch(e) { console.error(e); }

        await db.collection('payments').doc(paymentId).set({
          paymentId,
          eventId:    currentPayment.eventId,
          eventTitle: currentPayment.title, // เพิ่มชื่อรอบจ่าย
          email:      currentUser.email,
          name:       realName,
          paidAmount: currentPayment.totalAmount,
          penalty:    currentPayment.penalty,
          status:     'Pending',
          slipUrl:    slipUrl,
          paidAt:     new Date().toISOString()
        });

        // อัปเดตยอดรอตรวจสอบ
        try {
          await db.collection('system_stats').doc('overview').set({
            pendingCount: firebase.firestore.FieldValue.increment(1)
          }, { merge: true });
        } catch(e) { console.error('Stats error:', e); }

      } catch (dbError) {
        console.error("Firestore Error:", dbError);
        throw new Error('บันทึกข้อมูลฐานข้อมูลไม่สำเร็จ: ' + dbError.message);
      }

      document.getElementById('modalContent').style.display = 'none';
      document.getElementById('successState').style.display = 'block';
      fetchPayments(); // refresh list
    } catch (e) {
      console.error(e);
      alert('อัปโหลดไม่สำเร็จ: ' + e.message + '\n\nStack: ' + (e.stack || 'No stack trace'));
      btn.disabled = false;
      btn.textContent = 'ยืนยันการชำระเงิน';
    }
  }

  async function logout() {
    if (window.myAppDb && window.myAppDb.auth) {
      await window.myAppDb.auth.signOut();
    }
    sessionStorage.removeItem('loggedInUser');
    location.href = 'index.html';
  }

  // close modal on overlay click
  document.getElementById('paymentModal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  window.filterPbMatrix = function() {
    const term = document.getElementById('pbMatrixSearch').value.toLowerCase();
    const rows = document.querySelectorAll('.pb-matrix-row');
    rows.forEach(row => {
      const text = row.textContent.toLowerCase();
      row.style.display = text.includes(term) ? '' : 'none';
    });
  };
</script>
