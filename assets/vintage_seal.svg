<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <!-- Warm Antique Bronze / Gold Gradients -->
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfb173"/>
      <stop offset="35%" stop-color="#8e582e"/>
      <stop offset="70%" stop-color="#5a3315"/>
      <stop offset="100%" stop-color="#a87642"/>
    </linearGradient>
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c99552"/>
      <stop offset="50%" stop-color="#f5e1b5"/>
      <stop offset="100%" stop-color="#b8803e"/>
    </linearGradient>
    <radialGradient id="parchmentFill" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdf8ee"/>
      <stop offset="75%" stop-color="#f2e4cc"/>
      <stop offset="100%" stop-color="#ddc6a3"/>
    </radialGradient>
    <filter id="sealShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#2a1608" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- Shadow Group -->
  <g filter="url(#sealShadow)">
    <!-- Outer Scalloped / Starburst Edge -->
    <circle cx="120" cy="120" r="108" fill="#523118" stroke="url(#goldShine)" stroke-width="2.5"/>
    <circle cx="120" cy="120" r="102" fill="none" stroke="#e0b87c" stroke-width="1" stroke-dasharray="2.5 3.5"/>
    
    <!-- Outer Ribbon Ring -->
    <circle cx="120" cy="120" r="96" fill="#321b0d"/>
    <circle cx="120" cy="120" r="95" fill="none" stroke="url(#goldShine)" stroke-width="1.8"/>

    <!-- Circular Text Path -->
    <path id="textCircleTop" d="M 36,120 A 84,84 0 1,1 204,120" fill="none"/>
    <path id="textCircleBottom" d="M 204,120 A 84,84 0 0,1 36,120" fill="none"/>

    <text font-family="'Cinzel', Georgia, serif" font-size="10.5" font-weight="700" fill="#f5e1b5" letter-spacing="3.2">
      <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">
        ★ NARESUAN UNIVERSITY ★
      </textPath>
    </text>

    <text font-family="'Cinzel', Georgia, serif" font-size="9.5" font-weight="700" fill="#dfb173" letter-spacing="2.8">
      <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">
        • FINANCIAL SYSTEM •
      </textPath>
    </text>

    <!-- Inner Parchment Medallion -->
    <circle cx="120" cy="120" r="68" fill="url(#parchmentFill)" stroke="url(#goldShine)" stroke-width="2.2"/>
    <circle cx="120" cy="120" r="63" fill="none" stroke="#a67746" stroke-width="1" stroke-dasharray="1.5 2.5"/>

    <!-- Center Icon: Celestial Armillary Ring & Balance Scale / Star Motif -->
    <!-- Orbit Ring -->
    <ellipse cx="120" cy="120" rx="46" ry="16" fill="none" stroke="#7e4d26" stroke-width="1.6" transform="rotate(-26 120 120)"/>
    <ellipse cx="120" cy="120" rx="46" ry="16" fill="none" stroke="#dfb173" stroke-width="0.9" stroke-dasharray="4 2" transform="rotate(-26 120 120)"/>

    <!-- Center Monogram / Crest -->
    <!-- Balance Scale Beam -->
    <path d="M 96,108 L 144,108" stroke="#542e13" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="120" cy="108" r="3" fill="#7e4d26"/>
    <!-- Pillar -->
    <path d="M 120,105 L 120,136 M 112,136 L 128,136" stroke="#542e13" stroke-width="2" stroke-linecap="round"/>
    <!-- Scale Pans -->
    <path d="M 96,108 L 89,122 M 96,108 L 103,122" stroke="#8e582e" stroke-width="1"/>
    <path d="M 87,122 Q 96,128 105,122 Z" fill="#8e582e"/>
    
    <path d="M 144,108 L 137,122 M 144,108 L 151,122" stroke="#8e582e" stroke-width="1"/>
    <path d="M 135,122 Q 144,128 153,122 Z" fill="#8e582e"/>

    <!-- Star at Apex -->
    <polygon points="120,86 122.5,92.5 129,93 124,97.5 125.5,104 120,100 114.5,104 116,97.5 111,93 117.5,92.5" fill="url(#bronzeGrad)"/>

    <!-- Small Ribbons / Roman Numeral / Year -->
    <text x="120" y="148" font-family="'Cinzel', Georgia, serif" font-size="8.5" font-weight="700" fill="#542e13" text-anchor="middle" letter-spacing="1.5">
      BEC • BA
    </text>
    <text x="120" y="157" font-family="'Cinzel', Georgia, serif" font-size="7.5" font-weight="800" fill="#8e582e" text-anchor="middle" letter-spacing="1">
      MCMLXIX (69)
    </text>
  </g>
</svg>