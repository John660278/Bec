<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Reset Database</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body style="font-family: sans-serif; text-align: center; padding: 50px;">
  <h1 style="color: red;">🔥 ล้างฐานข้อมูลทั้งหมด (DANGER ZONE) 🔥</h1>
  <p>ปุ่มนี้จะลบ: รอบเก็บเงิน, สลิปจ่ายเงิน, ตารางเช็คยอด, รายรับ, รายจ่าย ทิ้งทั้งหมด (แต่จะเก็บรายชื่ออีเมลแอดมินและนิสิตไว้ให้เข้าสู่ระบบได้)</p>
  
  <button onclick="resetDB()" style="background: red; color: white; padding: 15px 30px; font-size: 20px; cursor: pointer; border: none; border-radius: 8px;">คลิกเพื่อล้างข้อมูลทั้งหมดเดี๋ยวนี้</button>

  <p id="status" style="margin-top: 20px; font-weight: bold;"></p>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA1Zuhs25HvceVZYpErBuqzhrrTZfN1Z0k",
      authDomain: "bec-admin-80e83.firebaseapp.com",
      projectId: "bec-admin-80e83",
      storageBucket: "bec-admin-80e83.firebasestorage.app",
      messagingSenderId: "1089372941715",
      appId: "1:1089372941715:web:880b6f08cdaded6b804c66"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function deleteCollection(collectionPath) {
      const snap = await db.collection(collectionPath).get();
      const batch = db.batch();
      snap.docs.forEach(doc => {
        batch.delete(doc.ref);
      });
      if (snap.size > 0) {
        await batch.commit();
      }
      return snap.size;
    }

    async function resetDB() {
      const status = document.getElementById('status');
      if (!confirm("ยืนยันการล้างข้อมูลทั้งหมด? (ย้อนกลับไม่ได้นะ!)")) return;
      
      status.innerText = "กำลังลบข้อมูล... ห้ามปิดหน้าต่างนี้!";
      status.style.color = "blue";
      
      try {
        let count = 0;
        count += await deleteCollection('events');
        count += await deleteCollection('payments');
        count += await deleteCollection('expenses');
        count += await deleteCollection('incomes');
        count += await deleteCollection('student_matrix');
        
        status.innerText = "✅ ล้างข้อมูลเสร็จสิ้นแล้ว! (ลบไป " + count + " รายการ) สามารถปิดหน้านี้แล้วกลับไปเริ่มใหม่ที่หน้าเว็บหลักได้เลยครับ";
        status.style.color = "green";
      } catch(e) {
        console.error(e);
        status.innerText = "❌ เกิดข้อผิดพลาด: " + e.message + " (กรุณาล็อกอินในหน้าแรกก่อนแล้วค่อยมาเปิดหน้านี้)";
        status.style.color = "red";
      }
    }
  </script>
</body>
</html>
